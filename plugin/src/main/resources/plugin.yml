name: LiveArena
version: '${project.version}'
main: dev.livearena.plugin.LiveArenaPlugin
api-version: '26.1.2'
description: Efectos para lives interactivos de LiveArena (tótems apilables y efectos survival en español).
author: LiveArena
commands:
  la:
    description: Comandos de LiveArena
    usage: /la totem <add|remove|set|get> <jugador> [cantidad] [espectador] | /la efecto <nombre> <jugador> [espectador] | /la efectos | /la reto <crear|sumar|mineral|pico|ganar>
    permission: livearena.admin
  habilidad:
    description: Habilidades cinemáticas de LiveArena
    usage: /habilidad <id> <objetivo> [lanzador|-] [espectador] | lista | detener <jugador> | debug <primitiva>
    aliases: [cinematica, hab]
    permission: livearena.admin
permissions:
  livearena.admin:
    description: Usar los comandos de LiveArena
    default: op
