# ─────────────────────────────────────────────
#  LiveArena — habilidades cinemáticas (/habilidad <id> <objetivo> [lanzador|-] [espectador])
#  Todos los números de las fichas están aquí. Recarga con /habilidad recargar.
#  Con el mod «LiveArena Cinemáticas» (NeoForge + GeckoLib) en tu PC se ven también la cámara,
#  el FOV, los destellos, el cielo y los modelos animados. Sin el mod, todo lo demás funciona igual.
# ─────────────────────────────────────────────

general:
  camaraCinematica: true       # tomar la cámara del objetivo (solo si tiene el mod)
  bloquesPorTick: 400          # presupuesto de destrucción por tick
  maxBloquesVoladores: 200     # límite global de bloques voladores visuales
  romperBloques: true
  restaurarBloques: true
  segundosRestauracion: 60
  colaMax: 10                  # habilidades en espera por jugador mientras está en otra
  bloquesProtegidos: []        # ej: [DIAMOND_BLOCK, BEACON]

escudo:            { radio: 4.0, duracionTicks: 1200, vidaCorazones: 50.0, reflejarProyectiles: true, empujarMobs: true }
onda_repulsion:    { radio: 20.0, fuerzaMax: 3.0, danio: 8.0, ticksExpansion: 15, romperFragiles: true, bloquesVoladoresVisuales: true }
corona_espadas:    { numeroEspadas: 12, danioPorEspada: 5.0, intervaloDisparoTicks: 3, velocidad: 1.8, romperBloqueAlImpactar: true }
super_rayo:        { danio: 25.0, radioArea: 4.0, radioCrater: 3, ignorarArmadura: false, crearFulguritas: true, grosor: 0.9 }
trueno_explosion:  { danioRayoMenor: 6.0, danioRayo: 15.0, danioExplosion: 30.0, radioCrater: 8, inmovilizar: true }
carrusel_creepers: { numeroCreepers: 8, radioOrbita: 6.0, velocidadMax: 3.0, danioPorCreeper: 5.0, romperBloques: true }
ojo_vacio:         { radio: 15.0, alturaLevitacion: 6.0, maxBloquesFlotantes: 120, danio: 24.0, radioCrater: 6 }
agujero_negro:     { radioAtraccion: 25.0, radioArranque: 10.0, radioHorizonte: 2.0, fuerzaMax: 0.25, danioTick: 2.0, danioColapso: 20.0, maxBloquesAbsorbidos: 600, destruirItems: true }
juicio_arcano:     { radioZona: 15.0, numeroRayos: 33, danioRayo: 8.0, danioFinal: 40.0, radioCraterFinal: 5 }
genkidama:         { alturaVuelo: 16.0, radioMax: 12.0, velocidad: 0.4, danio: 50.0, radioCrater: 14, profundidadCrater: 8, energiaDeJugadores: true, distanciaGokuSinLanzador: 30.0 }
meteorito:         { radioCrater: 18, profundidadCrater: 10, radioLetal: 6.0, radioDanio: 30.0, danioMax: 100.0, bloquesEyeccion: 80, radioSacudida: 150 }
mil_cortes:        { alturaSantuario: 20.0, enterrarSantuario: 0.3, distanciaSantuario: 14.0, radio: 10.0, cortesPorTick: 3, danioCorte: 1.0, danioFinal: 30.0, romperBloques: true, distanciaSukunaSinLanzador: 12.0 }
vacio_purpura:     { velocidad: 0.6, radioOrbe: 3.0, radioDestruccion: 3.0, radioAtraccion: 10.0, radioNucleo: 1.5, danioTick: 2.0, distanciaMax: 80.0, radioDetonacion: 7, danioFinal: 30.0 }
sangre_perforante: { distancia: 9.0, velocidadFlecha: 2.25, danio: 30.0, perforacion: 0.6, witherSegundos: 4, witherNivel: 2, empuje: 2.8, grosor: 0.22, distanciaDestruccion: 28.0, radioDestruccion: 1.4, romperBloques: true }
ataque_orbital:    { altura: 180.0, inclinacion: 72.0, escalaSatelite: 4.0, anchoLaser: 6.0, radioCrater: 22, profundidadCrater: 16, bloquesPorTick: 1500, danio: 60.0, radioDanio: 26.0, impulso: 1.6 }
akaza:             { distanciaAparicion: 8.0, radioCopo: 10.0, radioCrater: 7, danio: 20.0, danioGolpe: 0.5, impulsoGancho: 1.7, knockbackHorizontal: 2.5, knockbackVertical: 1.2 }

# Daño de cada habilidad al jugador objetivo (lo cambia la app en Cinemáticas → Daño y tótems):
#   corazonesGolpe: corazones de cada golpe durante la habilidad (-1 = los de la propia habilidad)
#   corazonesFinal: corazones del golpe final
#   totemsDurante:  tótems que quita mientras dura (uno por golpe, como mucho cada medio segundo)
#   totemsFinal:    tótems que quita en el golpe final
# Mientras le queden tótems el daño no le mata (los tótems que pierde son exactamente estos); sin tótems, sí.
danio:
  onda_repulsion: { corazonesGolpe: 1, corazonesFinal: 4, totemsDurante: 0, totemsFinal: 1 }
  corona_espadas: { corazonesGolpe: 2.5, corazonesFinal: 5, totemsDurante: 0, totemsFinal: 1 }
  super_rayo: { corazonesGolpe: 1, corazonesFinal: 12.5, totemsDurante: 0, totemsFinal: 1 }
  trueno_explosion: { corazonesGolpe: 3, corazonesFinal: 15, totemsDurante: 0, totemsFinal: 1 }
  carrusel_creepers: { corazonesGolpe: 2.5, corazonesFinal: 10, totemsDurante: 0, totemsFinal: 1 }
  ojo_vacio: { corazonesGolpe: 1, corazonesFinal: 12, totemsDurante: 0, totemsFinal: 1 }
  agujero_negro: { corazonesGolpe: 1, corazonesFinal: 10, totemsDurante: 0, totemsFinal: 1 }
  juicio_arcano: { corazonesGolpe: 4, corazonesFinal: 20, totemsDurante: 0, totemsFinal: 1 }
  genkidama: { corazonesGolpe: 1, corazonesFinal: 25, totemsDurante: 0, totemsFinal: 1 }
  meteorito: { corazonesGolpe: 1, corazonesFinal: 50, totemsDurante: 0, totemsFinal: 1 }
  mil_cortes: { corazonesGolpe: 0.5, corazonesFinal: 15, totemsDurante: 0, totemsFinal: 1 }
  vacio_purpura: { corazonesGolpe: 1, corazonesFinal: 15, totemsDurante: 0, totemsFinal: 1 }
  akaza: { corazonesGolpe: 0.5, corazonesFinal: 10, totemsDurante: 0, totemsFinal: 1 }
  sangre_perforante: { corazonesGolpe: 2, corazonesFinal: 15, totemsDurante: 0, totemsFinal: 1 }
  ataque_orbital: { corazonesGolpe: 1, corazonesFinal: 30, totemsDurante: 0, totemsFinal: 1 }

# Formato «sonidos del mod|sonidos de Minecraft»: los livearena:sfx.* son audios propios del mod (los oye quien
# lo tiene); lo que va después de «|», el resto de jugadores.
# Sonidos de cada habilidad. Si tienes un resource pack con sonidos propios, pon aquí su id
# (p. ej. "livearena:cortes.tajo"). Mientras tanto se usan sonidos vanilla parecidos.
sonidos:
  escudo.activar: block.beacon.activate
  escudo.impacto: block.amethyst_block.hit
  escudo.romper: block.glass.break
  onda.carga: block.beacon.power_select
  onda.liberar: entity.warden.sonic_boom
  corona.aparecer: item.trident.return,block.amethyst_block.chime
  corona.disparo: item.trident.throw,entity.arrow.shoot
  corona.impacto: item.trident.hit,block.anvil.land
  rayo.trueno_lejano: item.trident.thunder
  rayo.impacto: entity.lightning_bolt.impact,entity.lightning_bolt.thunder,entity.generic.explode
  trueno.menor: entity.lightning_bolt.impact,item.trident.thunder
  trueno.mayor: entity.lightning_bolt.thunder,entity.lightning_bolt.impact,item.trident.thunder
  trueno.explosion_grande: entity.generic.explode,entity.dragon_fireball.explode,entity.lightning_bolt.thunder
  carrusel.musica: block.note_block.bell
  carrusel.siseo: entity.creeper.primed
  carrusel.explosion: entity.generic.explode
  ojo.abrir: entity.elder_guardian.curse,entity.warden.emerge
  ojo.latido: entity.warden.heartbeat
  ojo.zumbido: block.beacon.ambient
  agujero.formacion: block.portal.trigger
  agujero.zumbido: block.beacon.ambient
  agujero.colapso: entity.warden.sonic_boom
  juicio.inicio: block.end_portal.spawn,block.enchantment_table.use
  juicio.carga: block.beacon.power_select,block.respawn_anchor.charge
  juicio.rayo: entity.lightning_bolt.impact,block.amethyst_block.break,entity.generic.explode
  juicio.final: entity.lightning_bolt.thunder,entity.generic.explode,block.beacon.deactivate
  esfera.inicio: block.conduit.activate,block.beacon.activate
  esfera.carga: block.respawn_anchor.charge,block.conduit.ambient.short
  esfera.lanzar: entity.warden.sonic_boom,entity.ender_dragon.shoot
  esfera.detonar: entity.generic.explode,entity.lightning_bolt.thunder,item.totem.use
  meteorito.entrada: item.firecharge.use
  meteorito.estampido: entity.lightning_bolt.thunder
  meteorito.impacto: entity.generic.explode
  cortes.tajo: "livearena:sfx.tajo|entity.player.attack.sweep"
  cortes.final: "livearena:sfx.tajo,livearena:sfx.onda_choque,livearena:sfx.golpe_impacto|entity.wither.break_block,entity.generic.explode"
  cortes.dominio: entity.warden.emerge,block.end_portal.spawn
  cortes.ambiente: ambient.crimson_forest.mood,entity.warden.heartbeat
  genkidama.aparicion: entity.breeze.land,block.beacon.activate
  genkidama.carga: block.respawn_anchor.charge,block.conduit.ambient.short
  genkidama.lanzar: entity.warden.sonic_boom,entity.ender_dragon.shoot
  genkidama.detonar: "livearena:sfx.explosion_grave,livearena:sfx.onda_choque|entity.generic.explode,entity.lightning_bolt.thunder,item.totem.use"
  sukuna.dominio: block.bell.resonate,entity.warden.emerge,block.end_portal.spawn
  gojo.aparicion: entity.illusioner.mirror_move,block.amethyst_block.resonate
  gojo.carga: block.beacon.power_select,block.respawn_anchor.charge
  gojo.disparo: entity.warden.sonic_boom,entity.wither.shoot
  gojo.detonacion: "livearena:sfx.explosion_grave,livearena:sfx.onda_choque|entity.generic.explode,entity.lightning_bolt.thunder,block.beacon.deactivate"
  akaza.aparicion: entity.breeze.land,entity.player.attack.strong
  akaza.despliegue: block.amethyst_block.resonate,block.beacon.activate
  akaza.golpe: "livearena:sfx.golpe_impacto,livearena:sfx.onda_choque|entity.generic.explode,entity.warden.attack_impact,entity.lightning_bolt.thunder"
  aura.vibrar: "livearena:sfx.aura|block.beacon.ambient"
  personaje.desvanecer: "livearena:sfx.desvanecer|block.amethyst_block.resonate,entity.illusioner.mirror_move"
  choso.aparicion: block.bubble_column.whirlpool_inside,entity.warden.emerge
  choso.carga: "livearena:sfx.sangre_burbujas,livearena:sfx.aura|block.bubble_column.whirlpool_inside,block.beacon.ambient"
  choso.compresion: "livearena:sfx.sangre_burbujas|block.respawn_anchor.charge,block.honey_block.break"
  choso.disparo: "livearena:sfx.silbido_perforante,livearena:sfx.onda_choque|entity.warden.sonic_boom,item.trident.riptide_3,entity.arrow.shoot"
  choso.impacto: "livearena:sfx.golpe_impacto,livearena:sfx.onda_choque|entity.player.attack.crit,entity.generic.explode,block.slime_block.break"
  orbital.fijado: "livearena:sfx.objetivo_fijado|block.beacon.power_select,block.note_block.bit"
  orbital.alarma: "livearena:sfx.pitido|block.note_block.pling"
  orbital.subida: "livearena:sfx.whoosh|entity.firework_rocket.launch,item.elytra.flying"
  orbital.activar: block.beacon.activate,block.conduit.activate,block.respawn_anchor.charge
  orbital.carga: "livearena:sfx.carga_canon|block.respawn_anchor.set_spawn,block.beacon.ambient"
  orbital.disparo: "livearena:sfx.laser_disparo,livearena:sfx.onda_choque|entity.warden.sonic_boom,entity.lightning_bolt.thunder,block.beacon.deactivate"
  orbital.impacto: "livearena:sfx.explosion_grave,livearena:sfx.onda_choque|entity.generic.explode,entity.lightning_bolt.thunder,entity.dragon_fireball.explode,entity.warden.sonic_boom"
  akaza.punetazo: entity.player.attack.crit,entity.player.attack.knockback
  akaza.rafaga: entity.breeze.shoot,entity.player.attack.sweep

# Frases de los personajes (subtítulo en pantalla; sin el mod salen en la barra de acción). Vacío = sin frase.
frases:
  goku_1: "¡Escúchenme todos!"
  goku_2: "¡Denme un poco de su energía!"
  goku_3: "¡La necesito!"
  gojo_azul: "Ritual maldito de amplificación: Azul."
  gojo_rojo: "Ritual maldito de inversión: Rojo."
  gojo_vacio: "Vacío…"
  gojo_purpura: "¡Púrpura!"
  sukuna_dominio: "Extensión de dominio…"
  sukuna_templo: "Templo del mal."
  akaza_muerte: "Muerte destructiva…"
  akaza_brujula: "¡Aguja de brújula!"
  choso_tecnica: "Técnica de manipulación de sangre…"
  choso_perforante: "¡Sangre Perforante!"
  ojo_vacio: "Te estoy viendo..."

# Voces de los personajes: audios incluidos en el mod «LiveArena Cinemáticas» (los oye quien tiene el mod).
# Las cinemáticas de Goku, Gojo, Sukuna y Akaza están sincronizadas con estos audios.
#   activadas: false  → sin voces (vuelven los sonidos de Minecraft).
#   volumen: 0.0 a 1.0.  Para usar otro audio de un resource pack: gojo: "mipack:mi.sonido"
voces:
  activadas: true
  volumen: 1.0
  goku: "livearena:voz.goku"
  gojo: "livearena:voz.gojo"
  sukuna: "livearena:voz.sukuna"
  akaza: "livearena:voz.akaza"
  choso: "livearena:voz.choso"
