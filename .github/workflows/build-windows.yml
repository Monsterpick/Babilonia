name: Build Windows (.exe)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Compilar el plugin LiveArena (Paper)
        working-directory: plugin
        run: |
          META=https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
          VERSIONS=$(curl -fsSL "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g')
          VER=$(echo "$VERSIONS" | grep '^26\.1\.2' | grep -v SNAPSHOT | tail -1)
          [ -z "$VER" ] && VER=$(echo "$VERSIONS" | grep '^26\.1\.2' | tail -1)
          echo "paper-api: $VER"
          mvn -B package -Dpaper.version="$VER" 2>&1 | grep -E "ERROR|WARN|BUILD|paper-api" | head -60; test -f target/LiveArena.jar
      - uses: actions/upload-artifact@v4
        with:
          name: LiveArena-plugin
          path: plugin/target/LiveArena.jar
          if-no-files-found: error

  basedefense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar el minijuego Base Defense (Paper, Gradle Kotlin DSL)
        working-directory: minigames/base-defense
        run: |
          META=https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
          VER=$(curl -fsSL "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep '^26\.1\.2' | grep -v SNAPSHOT | tail -1)
          echo "paper-api: $VER"
          chmod +x gradlew
          ./gradlew --no-daemon build ${VER:+-PpaperVersion=$VER}
          test -f build/libs/BaseDefense.jar
      - uses: actions/upload-artifact@v4
        with:
          name: BaseDefense-plugin
          path: minigames/base-defense/build/libs/BaseDefense.jar
          if-no-files-found: error

  parkour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar el minijuego Parkour LIVE (Paper, Gradle Kotlin DSL)
        working-directory: minigames/parkour
        run: |
          META=https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
          VER=$(curl -fsSL "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep '^26\.1\.2' | grep -v SNAPSHOT | tail -1)
          echo "paper-api: $VER"
          chmod +x gradlew
          ./gradlew --no-daemon build ${VER:+-PpaperVersion=$VER}
          test -f build/libs/ParkourLive.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ParkourLive-plugin
          path: minigames/parkour/build/libs/ParkourLive.jar
          if-no-files-found: error

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar el mod LiveArena Cinemáticas (NeoForge + GeckoLib)
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
          cp build/libs/LiveArena-Cinematicas-*.jar LiveArena-Cinematicas.jar
      - uses: actions/upload-artifact@v4
        with:
          name: LiveArena-mod
          path: mod/LiveArena-Cinematicas.jar
          if-no-files-found: error

  windows:
    needs: [test, plugin, basedefense, parkour, mod]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: LiveArena-plugin
          path: apps/server/assets/plugins
      - uses: actions/download-artifact@v4
        with:
          name: BaseDefense-plugin
          path: apps/server/assets/plugins
      - uses: actions/download-artifact@v4
        with:
          name: ParkourLive-plugin
          path: apps/server/assets/plugins
      - uses: actions/download-artifact@v4
        with:
          name: LiveArena-mod
          path: apps/server/assets/mods
      - run: pnpm build
      - name: Empaquetar instalador y portable
        run: pnpm --filter @livearena/desktop dist
      - name: Añadir el plugin y el mod junto a los .exe
        run: |
          Copy-Item apps/server/assets/plugins/LiveArena.jar apps/desktop/release/
          Copy-Item apps/server/assets/mods/LiveArena-Cinematicas.jar apps/desktop/release/
          Copy-Item apps/server/assets/plugins/BaseDefense.jar apps/desktop/release/
          Copy-Item apps/server/assets/plugins/ParkourLive.jar apps/desktop/release/
      - uses: actions/upload-artifact@v4
        with:
          name: LiveArena-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/LiveArena.jar
            apps/desktop/release/LiveArena-Cinematicas.jar
            apps/desktop/release/BaseDefense.jar
            apps/desktop/release/ParkourLive.jar
          if-no-files-found: error
      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/LiveArena.jar
            apps/desktop/release/LiveArena-Cinematicas.jar
            apps/desktop/release/BaseDefense.jar
            apps/desktop/release/ParkourLive.jar
