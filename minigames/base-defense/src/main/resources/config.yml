# ╔══════════════════════════════════════════════════════════════════╗
# ║  BASE DEFENSE · minijuego de defender la base para TikTok LIVE  ║
# ╚══════════════════════════════════════════════════════════════════╝
# Recarga en caliente con /bd reload (los cambios de "arena" se aplican al regenerar).
# Colores con & (&a verde, &c rojo, &e amarillo, &6 dorado, &l negrita…).

# ── Mundo y arena ───────────────────────────────────────────────────
mundo:
  nombre: basedefense
  # Bioma de la arena. "basedefense:ceniza" es el bioma propio del plugin (niebla y cielo
  # apagados, ceniza cayendo). Alternativas vanilla: minecraft:pale_garden, minecraft:basalt_deltas.
  bioma: basedefense:ceniza
  # Hora fija (0-24000). 12600 ≈ atardecer, 13400 ≈ anochecer, 18000 = medianoche.
  hora: 12400
  # despejado | lluvia | tormenta
  clima: despejado

arena:
  semilla: 1337
  largo: 46          # bloques de carril (de la base al portal) · más corto = se ven antes y más grandes
  ancho: 9           # bloques de ancho del carril (estrecho: todo cabe en el recorte vertical 9:16)
  bosque: 13         # grosor del bosque a cada lado del carril
  altura: 64         # Y del suelo del carril
  alturaBase: 0      # 0 = a ras de suelo tras una barricada baja (cara a cara con los zombis)
  # 0.0 – 2.0 · cantidad de árboles, ruinas y restos
  densidadDecorado: 1.0
  # luz invisible del carril (0-15). Sube si en el stream los mobs se ven oscuros.
  luzCarril: 12
  # bloques colocados por tick al generar (más = más rápido, pero más tirón)
  bloquesPorTick: 12000

# ── Base ─────────────────────────────────────────────────────────────
base:
  vida: 1500
  # Al caer: segundos de pausa antes de reiniciar la ronda
  pausaAlCaer: 6
  # Vaciar la cola de mobs pendientes cuando cae la base
  vaciarColaAlCaer: false

# ── Rondas ───────────────────────────────────────────────────────────
ronda:
  duracion: 900      # segundos (15:00)
  # Al ganar una ronda: limpiar mobs y curar la base
  limpiarAlGanar: true
  curarAlGanar: true

# ── Mobs ─────────────────────────────────────────────────────────────
mobs:
  tope: 300             # máximo de mobs del juego vivos a la vez (lo demás espera en cola)
  spawnPorTick: 6       # cuántos salen del portal por tick como máximo
  hordaGrande: 25       # a partir de esta cantidad se anuncia "¡LLEGA LA HORDA!"
  maxPorComando: 500    # tope de cantidad por /ttspawn
  # daño = lo que quita a la base CADA golpe mientras la asedia (los creepers explotan una vez)
  # Nombre sobre los mobs de un donante ({usuario}). Debajo va su barra de vida.
  etiqueta: "&e{usuario}"
  # En hordas grandes solo se nombra a una parte; el resto lleva solo su barra de vida.
  etiquetasPorHorda: 6
  etiquetasMax: 90
  # fase = desde qué fase sale en las oleadas automáticas · peso = lo frecuente que es.
  # Añadir uno nuevo = añadir una entrada (entidad = cualquier mob de Minecraft que camine).
  tipos:
    zombie:          { entidad: zombie,          vida: 14,  velocidad: 0.27, danio: 4,  nombre: "Zombi",               fase: 1, peso: 10 }
    skeleton:        { entidad: skeleton,        vida: 12,  velocidad: 0.29, danio: 3,  nombre: "Esqueleto",           fase: 1, peso: 7 }
    spider:          { entidad: spider,          vida: 11,  velocidad: 0.38, danio: 3,  nombre: "Araña",               fase: 1, peso: 5 }
    zombie_villager: { entidad: zombie_villager, vida: 18,  velocidad: 0.27, danio: 4,  nombre: "Aldeano zombi",       fase: 2, peso: 4 }
    husk:            { entidad: husk,            vida: 22,  velocidad: 0.26, danio: 6,  nombre: "Momia",               fase: 2, peso: 4 }
    piglin:          { entidad: piglin,          vida: 20,  velocidad: 0.34, danio: 6,  nombre: "Piglin",              fase: 2, peso: 6 }
    stray:           { entidad: stray,           vida: 22,  velocidad: 0.29, danio: 5,  nombre: "Esqueleto glacial",   fase: 3, peso: 4 }
    cave_spider:     { entidad: cave_spider,     vida: 12,  velocidad: 0.42, danio: 4,  nombre: "Araña venenosa",      fase: 3, peso: 4 }
    wither_skeleton: { entidad: wither_skeleton, vida: 36,  velocidad: 0.30, danio: 9,  nombre: "Esqueleto wither",    fase: 3, peso: 5 }
    vindicator:      { entidad: vindicator,      vida: 34,  velocidad: 0.34, danio: 10, nombre: "Vindicador",          fase: 4, peso: 3 }
    bogged:          { entidad: bogged,          vida: 22,  velocidad: 0.29, danio: 5,  nombre: "Esqueleto pantanoso", fase: 4, peso: 3 }
    piglin_brute:    { entidad: piglin_brute,    vida: 60,  velocidad: 0.34, danio: 14, nombre: "Piglin bruto",        fase: 4, peso: 3 }
    creeper:         { entidad: creeper,         vida: 20,  velocidad: 0.27, danio: 80, nombre: "Creeper",             fase: 3, peso: 3 }
    ravager:         { entidad: ravager,         vida: 120, velocidad: 0.24, danio: 25, nombre: "Devastador",          fase: 5, peso: 1 }

# ── Oleadas y fases ──────────────────────────────────────────────────
# La ronda se divide en fases; cada fase suma mobs nuevos y oleadas más grandes (además de los regalos).
oleadas:
  activadas: true
  fases: 5
  cada: 26             # segundos entre oleadas automáticas
  tamano: 5            # mobs por oleada en la fase 1
  crecimiento: 3       # mobs más por oleada en cada fase
  vidaPorFase: 0.10    # +25 % de vida de los mobs por fase
  velocidadPorFase: 0.04

# ── Dificultad ───────────────────────────────────────────────────────
# Zombis (zombi, momia, aldeano zombi): variantes y desmembramiento.
zombis:
  # Corredores: más rápidos y algo más frágiles.
  corredor: { probabilidad: 0.18, velocidad: 1.5 }
  # Brutos: enormes, lentos, con mucha vida y golpe fuerte (aparecen desde la fase indicada).
  bruto: { probabilidad: 0.08, vida: 2.2, tamano: 1.55, desdeFase: 2 }
  # Al matarlos salen miembros volando (con explosivos, el cuerpo entero). Necesita el pack de texturas.
  desmembrar: true
  maxPiezas: 70
  segundosPiezas: 4

dificultad:
  version: 6
  # Asedio: los mobs que llegan a la base se quedan golpeándola (cada X s) hasta que los matas.
  asedio: true
  golpeCada: 2.4
  # Élites: más vida, más rápidos, con armadura. Probabilidad = base + porFase × (fase − 1) (+ la de la amenaza).
  eliteBase: 0.02
  elitePorFase: 0.02
  eliteVida: 1.6
  eliteVelocidad: 1.15
  # Cada ronda superada: +X de vida a los mobs y de tamaño de las oleadas (0.35 = +35 %).
  porRonda: 0.2
  # Jefes: el daño de las balas se multiplica por su «blindaje» (los explosivos hacen el daño completo).
  # Amenaza: sube con lo que mandan los espectadores y baja sola; cada nivel endurece todo.
  amenaza:
    porMob: 1            # puntos por cada mob donado
    porJefe: 30          # puntos por cada jefe donado
    porNivel: 80         # puntos para subir un nivel
    niveles: 5
    bajadaPorSegundo: 1.5
    vida: 0.06          # +18 % de vida de los mobs por nivel
    velocidad: 0.04      # +6 % de velocidad por nivel
    oleada: 0.12         # +30 % de mobs por oleada por nivel
    elite: 0.02          # +5 % de élites por nivel

# ── Jefes ────────────────────────────────────────────────────────────
# No desaparecen al llegar: se colocan frente a la base y la atacan hasta que los matas.
jefes:
  furia: 40               # % de vida bajo el que se enfurece (ataca y se mueve más rápido)
  aceleracionFuria: 1.6
  tipos:
    wither:
      entidad: wither
      vida: 1000
      velocidad: 0.34      # bloques por tick
      escala: 1.6
      altura: 9            # altura de vuelo sobre el carril
      distanciaAtaque: 20  # se queda a esta distancia de la base y dispara
      ataqueCada: 1.8      # segundos entre ráfagas de calaveras
      danioAtaque: 30      # daño a la base por calavera (dispárales para destruirlas)
      blindaje: 0.8
      invocar: { tipo: wither_skeleton, cantidad: 2, cada: 18 }
      nombre: "WITHER"
    dragon:
      entidad: ender_dragon
      vida: 1400
      velocidad: 0.36
      escala: 1.0
      altura: 16
      distanciaAtaque: 26
      ataqueCada: 2.2      # bolas de fuego (dispárales para devolvérselas)
      danioAtaque: 55
      danioDevuelta: 120   # daño al dragón con su bola devuelta
      blindaje: 0.75
      invocar: { tipo: husk, cantidad: 3, cada: 20 }
      nombre: "DRAGÓN DEL END"
    warden:
      entidad: warden
      vida: 1300
      velocidad: 0.30
      escala: 1.3
      distanciaAtaque: 24  # desde aquí lanza su cañón sónico
      ataqueCada: 3.0
      danioAtaque: 50      # cañón sónico
      danioEmbestida: 80  # cuando llega a la base embiste una y otra vez
      embestidaCada: 2.2
      blindaje: 0.75
      invocar: { tipo: cave_spider, cantidad: 3, cada: 16 }
      nombre: "WARDEN"

# ── Meta de likes ────────────────────────────────────────────────────
likes:
  meta: 5000
  jefe: wither
  donante: "la comunidad"

# ── Armas ────────────────────────────────────────────────────────────
# tipo: hitscan | cohete | granada · cadencia = disparos/s · dispersion en grados · recarga en s
# cargador = balas por cargador · reserva = balas de repuesto al empezar (-1 = infinitas)
# La barrita bajo cada arma en la hotbar es la munición que le queda en el cargador.
# sonido: "sonido del pack|sonido vanilla" (el segundo se usa si no aceptas el pack)
armas:
  # desbloqueo = fase de la ronda en la que se consigue (hasta entonces sale con candado). Al caer la base se pierden.
  pistola:       { slot: 0, item: crossbow,        modelo: "basedefense:pistola",       nombre: "&ePistola",        desbloqueo: 1, tipo: hitscan, automatica: false, danio: 15,  cadencia: 6,   alcance: 110, dispersion: 0.5, cargador: 15,  reserva: -1,  recarga: 1.3, sonido: "basedefense:arma.pistola|entity.firework_rocket.blast" }
  subfusil:      { slot: 1, item: iron_hoe,        modelo: "basedefense:subfusil",      nombre: "&bSubfusil",       desbloqueo: 1, tipo: hitscan, automatica: true,  danio: 8,  cadencia: 12,  alcance: 90,  dispersion: 1.6, cargador: 40,  reserva: -1,  recarga: 1.8, sonido: "basedefense:arma.subfusil|entity.firework_rocket.blast" }
  ametralladora: { slot: 2, item: netherite_hoe,   modelo: "basedefense:ametralladora", nombre: "&cAmetralladora",  desbloqueo: 2, tipo: hitscan, automatica: true,  danio: 9,  cadencia: 13,  alcance: 120, dispersion: 1.8, cargador: 60,  reserva: 240, recarga: 3.6, sonido: "basedefense:arma.ametralladora|entity.firework_rocket.large_blast" }
  lanzagranadas: { slot: 3, item: fire_charge,     modelo: "basedefense:lanzagranadas", nombre: "&aLanzagranadas",  desbloqueo: 3, tipo: granada, automatica: false, danio: 60, cadencia: 1.5, alcance: 80,  dispersion: 0,   cargador: 4,   reserva: 12,   recarga: 2.8, radio: 4.5, velocidad: 1.35, rebotes: 2, mecha: 2.0, sonido: "basedefense:arma.granada|entity.snowball.throw" }
  lanzacohetes:  { slot: 4, item: firework_rocket, modelo: "basedefense:lanzacohetes",  nombre: "&6Lanzacohetes",   desbloqueo: 4, tipo: cohete,  automatica: false, danio: 110, cadencia: 1.0, alcance: 140, dispersion: 0,   cargador: 2,   reserva: 6,   recarga: 3.2, radio: 5.0, velocidad: 2.2, sonido: "basedefense:arma.cohete|entity.firework_rocket.launch" }
  minigun:       { slot: 5, item: diamond_hoe,     modelo: "basedefense:minigun",       nombre: "&d&lMinigun",      desbloqueo: 5, tipo: hitscan, automatica: true,  danio: 7,  cadencia: 20,  balasPorTick: 2, calentamiento: 1.0, alcance: 120, dispersion: 3.0, cargador: 200, reserva: 200, recarga: 4.5, sonido: "basedefense:arma.minigun|entity.firework_rocket.blast" }

# ── Munición y suministros ──────────────────────────────────────────
municion:
  probabilidadCaja: 0.15      # un mob suelta una caja de munición (vuela sola hasta ti)
  probabilidadCajaJefe: 1.0
  cajaCargadores: 0.8        # una caja pequeña da esta fracción de cargador del arma que más lo necesita
  suministroAlEmpezarFase: true   # caja de suministros en cada fase
  suministroCada: 150         # segundos entre cajas automáticas (0 = solo por fase y regalos)
  suministroCargadores: 1.5   # cargadores que da un suministro a cada arma desbloqueada

# ── Meta de bajas ────────────────────────────────────────────────────
# Cada X bajas cae un cofre dorado en la base: munición para todo, +10 % de vida y daño doble un rato.
recompensa:
  bajas: 60                   # bajas para el primer cofre (0 = sin metas)
  incremento: 20              # cada meta cumplida, la siguiente pide estas bajas más
  danioDobleSegundos: 20

# ── Ataques aliados (/ttaliado <tipo> <usuario>) ─────────────────────
# Los regalan los espectadores para ayudar. Solo dañan a los mobs del juego (a los jefes, la mitad).
aliados:
  misil: { danio: 160, radio: 7 }                  # cae sobre el grupo más denso
  bombardeo: { bombas: 14, danio: 90, radio: 5, altura: 20, duracionVuelo: 90, tamanoAvion: 7 }  # un avión cruza el carril soltando bombas
  rayo: { danio: 16, ancho: 4, duracion: 3.5 }      # rayo orbital que barre el carril (daño cada 2 ticks)

# ── Pack de texturas ─────────────────────────────────────────────────
# Texturas apocalípticas, modelos 3D de las armas y sonidos propios. El plugin lo sirve él mismo.
paquete:
  activado: true
  puerto: 25590
  # Dirección desde la que tu Minecraft descarga el pack. Jugando en tu PC: 127.0.0.1. En un host: su IP pública.
  url: "http://127.0.0.1:{puerto}/basedefense.zip"
  obligatorio: false

# ── Rendimiento ──────────────────────────────────────────────────────
rendimiento:
  particulasPorTick: 900
  sonidosPorTick: 14
  puntosTrazo: 18
  manchasSangre: 40
  cenizaPorTick: 6

# ── Ambiente ─────────────────────────────────────────────────────────
ambiente:
  sonidos: true
  # segundos entre sonidos lejanos (al azar entre min y max)
  intervaloMin: 6
  intervaloMax: 16
  lista:
    - ambient.cave
    - entity.zombie.ambient
    - entity.wolf.howl
    - ambient.basalt_deltas.additions
    - entity.zombie_villager.ambient
    - block.bell.resonate

